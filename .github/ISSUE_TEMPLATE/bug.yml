name: Reportar problema no repositório
description: Link quebrado, navegação, CI ou exemplo incorreto.
title: "fix: "
labels:
  - bug
body:
  - type: input
    id: location
    attributes:
      label: Arquivo ou URL
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problema observado
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
  - type: textarea
    id: evidence
    attributes:
      label: Evidência ou reprodução
