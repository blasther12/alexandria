name: Deploy Alexandria to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate PWA icons and study excerpts
        run: |
          python -m pip install --disable-pip-version-check cairosvg
          python scripts/generate_site_icons.py
          python scripts/build_source_excerpts.py
          test -s docs/icons/icon-192.png
          test -s docs/icons/icon-512.png
          test -s docs/icons/apple-touch-icon.png
          test -s docs/source-excerpts.json

      - name: Validate site and thematic depth
        run: |
          python scripts/validate_site.py
          python scripts/validate_learning_extras.py
          python scripts/validate_labs_ui.py
          python scripts/audit_readability.py
          python scripts/validate_chapter_depth.py
          python -m json.tool docs/data.json > /dev/null
          python -m json.tool docs/learning-map.json > /dev/null
          python -m json.tool docs/labs.json > /dev/null
          python -m json.tool docs/source-excerpts.json > /dev/null
          python -m json.tool docs/theme-guides.json > /dev/null
          python -m json.tool docs/chapter-depth.json > /dev/null
          python -m json.tool docs/manifest.webmanifest > /dev/null
          node --check docs/assets/app.js
          node --check docs/assets/chapters-v2.js
          node --check docs/assets/fundamentals-depth.js
          node --check docs/assets/deep-chapters.js
          node --check docs/assets/learning-tools.js
          node --check docs/assets/chapter-meta.js
          node --check docs/assets/labs-tools.js
          node --check docs/assets/clarity.js
          node --check docs/assets/source-reading.js
          node --check docs/assets/theme-guide.js
          node --check docs/assets/reading-header.js
          node --check docs/assets/compact-theme-list.js
          node --check docs/assets/theme-bootstrap.js
          node --check docs/assets/ecosystem.js
          test -s docs/assets/chapters.css
          test -s docs/assets/fundamentals-depth.css
          test -s docs/assets/deep-chapters.css
          test -s docs/assets/learning-tools.css
          test -s docs/assets/chapter-meta.css
          test -s docs/assets/labs-tools.css
          test -s docs/assets/clarity.css
          test -s docs/assets/source-reading.css
          test -s docs/assets/theme-guide.css
          test -s docs/assets/compact-theme-list.css
          test -s docs/assets/ecosystem.css
          test -s docs/icons/alexandria-mark.svg
          test -s docs/404.html
          test -s docs/robots.txt
          test -s docs/sitemap.xml
          test -s labs/README.md

      - name: Validate ecosystem contract
        uses: blasther12/blasther12.github.io/.github/actions/validate-ecosystem@main
        with:
          site-dir: ./docs
          entry: index.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
