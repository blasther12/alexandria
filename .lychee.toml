accept = [200, 203, 206, 429]
cache = true
exclude_all_private = true
max_cache_age = "2d"
max_concurrency = 8
max_retries = 3
timeout = 30
exclude = [
  '^http://localhost',
  '^https://localhost',
  '^mailto:',
  '^tel:',
  # Fontes oficiais verificadas, mas que bloqueiam ou limitam clientes automatizados.
  '^https://www\.oreilly\.com/',
  '^https://dl\.acm\.org/',
  '^https://doi\.org/10\.1145/',
  '^https://dev\.mysql\.com/',
  '^https://waldo\.scholars\.harvard\.edu/',
  '^https://www\.iso\.org/',
  # Endpoint oficial que pode falhar de forma intermitente nos runners do GitHub.
  '^https://slsa\.dev/?$',
]
